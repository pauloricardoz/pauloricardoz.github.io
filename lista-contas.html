  <header id="home" class="header list-header">

    <div class="header-content container">
      <h1 class="header-title">
        <span class="up">Lista de Contas</span>
      </h1>
    </div>
  </header>
  <section class="section pt-0">

    <form onsubmit="submit(event)" id="form">
      <input type="text" id="contaInput" placeholder="Digite o nome da conta" required>
      <input type="number" id="dateInput" placeholder="dia vencimento" required max="31" min="1">
      <input type="number" id="valorInput" placeholder="valor" required min="0">
      <button type="submit" id="btn-submit">Adicionar</button>
      <button type="reset" id="btn-reset">Limpar</button>
    </form>
    <ul id="lista">
      <!-- As contas serão listadas aqui -->
    </ul>

    <div>

      <a href="javascript:void(0)" id="entrar-edit" onclick="front.changeEditMode()">
        <span>Editar</span>
      </a>

      <a href="javascript:void(0)" id="sair-edit" onclick="front.changeEditMode()" style="display: none;">
        <span>Fechar edição</span>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
